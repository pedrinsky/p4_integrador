<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Incidencias</title>
    <link rel="icon" type="image/png" href="assets/logo-muni-azul.png">
    <!-- Bootstrap CSS desde node_modules -->
    <link rel="stylesheet" href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/style.css"></link>
    <!-- <script defer src=" "></script> -->
</head>
<body>
    <header class="top-header">
        <div class="header-izq">
            <button id="btn-menu" class="btn-barra">☰</button>
            <img class="logo-muni-header" src="../../images/logo-muni.png" alt="Logo">
        </div>
        
        <div class="perfil-usuario">
            <div class="avatar-circulo">EM</div>
            <div class="textos-usuario">
                <span class="nombre-usuario"> Empleado Muni</span>
                <span class="rol-usuario"> Empleado Municipal </span>
            </div>
        </div>
    </header>
    <div class="main-layout">
        <aside class="lat-bar">
            <ul class="nav-list">
                <ul class="menu-item active">
                    <a href="empleado-municipal-articulos.html"> Artículos</a>
                </ul>
                <ul class="menu-item">
                    <a href="empleado-municipal-incidencias.html"> Incidencias</a>
                </ul>
                <li class="menu-item logout-item">
                    <a href="../../index.html"> Cerrar sesión</a>
                </li>
            </ul>
        </aside>
        <main class="cuerpo">
            <h1 >Artículos Disponibles</h1>
            <div class="tabla-resultados">
                <table class="tabla-incidencias">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Area</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-articulos">
                        <!-- Filas renderizadas por JS -->
                    </tbody>
                </table>
            </div>
            <nav aria-label="Navegación de páginas" class="contenedor-paginacion">
                <ul class="pagination" id="paginacionIncidencias"></ul>
            </nav>
        </main>
    </div>
    
    <script type="module" src="../../js/empleado-municipal-articulos.js"></script>
</body>
</html>
