<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulos</title>
    <link rel="stylesheet" href="../../css/style.css">
    </link>
</head>

<body>
    <header class="top-header">
        <div class="header-izq">
            <button id="btn-menu" class="btn-barra">☰</button>
            <img class="logo-muni-header" src="../../images/logo-muni.png" alt="Logo">
        </div>
        <div class="perfil-usuario">
            <div class="avatar-circulo">algo</div>
            <div class="textos-usuario">
                <span class="nombre-usuario"> Probando que onda</span>
                <span class="rol-usuario"> Empleado de Sistemas </span>
            </div>
        </div>
    </header>
    <div class="main-layout">
        <aside class="lat-bar">
            <ul class="nav-list">
                <ul class="menu-item">
                    <a href="empleado-sistemas-incidencias.html"> Incidencias asignadas</a>
                </ul>
                <ul class="menu-item active">
                    <a href="empleado-sistemas-articulos.html"> Articulos</a>
                </ul>
                <ul class="menu-item">
                    <a href="empleado-sistemas-categorias.html"> Categorias</a>
                </ul>
                <li class="menu-item logout-item">
                    <a href="../../index.html"> Cerrar sesión</a>
                </li>
            </ul>
        </aside>
        <main class="cuerpo">
            <div class="tarjeta-contenedora" style="margin-bottom: 20px;">
                <!-- Asignamos ID local para que sea detectable desde JS -->
                <button id="btn-abrir-creacion" class="btn-buscar">Crear artículo</button>
            </div>

            <div class="tabla-resultados">
                <table class="tabla-incidencias">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Area</th>
                            <th scope="col">categoria</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Activo</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-articulos">
                    </tbody>
                </table>
            </div>
        </main> 
        <script src="../../js/empleado-sistemas-articulos.js"></script>
        <script type="module" src="../../main.js"></script>

    </div>
    <!-- MODAL DE CREACION -->
    <div id="modal-creacion" class="modal-overlay" style="display: none;">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h3>Crear Nuevo Artículo</h3>
                <button id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
            </div>
            <div class="modal-cuerpo">
                
                <label for="input-descripcion">Descripción del Artículo:</label>
                <input type="text" id="input-descripcion" class="selector-opcion" placeholder="Ej: Monitor 24 Pulgadas">

                <label for="selector-area">Área responsable:</label>
                <select id="selector-area" class="selector-opcion">
                    <option value="">-- Seleccionar Área --</option>
                    <option value="1">Legales</option>
                    <option value="2">Personal</option>
                    <option value="3">Sistemas</option>
                    <option value="4">Hacienda</option>
                    <option value="5">Finanzas</option>
                    <option value="6">Salud y Accion Social</option>
                    <option value="7">Desarrollo Urbano</option>
                </select>

                <label for="selector-categoria">Categoría específica:</label>
                <select id="selector-categoria" class="selector-opcion">
                    <option value="">-- Categoría --</option>
                    <option value="1">Periférico</option>
                    <option value="2">Notebooks</option>
                    <option value="3">PC Escritorio</option>
                    <option value="4">CPU</option>
                    <option value="5">Almacenamiento</option>
                    <option value="6">Equipos de Red</option>
                    <option value="7">Otro</option>
                </select>

                <label for="selector-activo">Estado Inicial:</label>
                <select name="activo" id="selector-activo" class="selector-empleado">
                    <option value="1">Activo</option>
                    <option value="0">Desactivado</option>
                </select>

            </div>
            <div class="modal-pie">
                <button id="btn-confirmar-creacion" class="btn-buscar">Añadir Artículo</button>
            </div>
        </div>
    </div>
</body>

</html>
