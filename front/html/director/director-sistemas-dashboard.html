<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Municipalidad</title>
    <!-- Solo importamos los iconos, NO el framework bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>

  <body>
    <header class="top-header">
      <div class="header-izq">
        <button id="btn-menu" class="btn-barra">☰</button>
        <img
          class="logo-muni-header"
          src="../../images/logo-muni.png"
          alt="Logo"
        />
      </div>

      <div class="perfil-usuario">
        <div class="avatar-circulo">algo</div>
        <div class="textos-usuario">
          <span class="nombre-usuario"> Probando que onda</span>
          <span class="rol-usuario"> Director de Sistemas </span>
        </div>
      </div>
    </header>
    <div class="main-layout">
      <aside class="lat-bar">
        <ul class="nav-list">
          <ul class="menu-item">
            <a href="director-sistemas-incidencias.html"> Incidencias</a>
          </ul>
          <ul class="menu-item active">
            <a href="director-sistemas-dashboard.html"> Dashboard</a>
          </ul>

          <li class="menu-item logout-item">
            <a href="../../index.html"> Cerrar sesión</a>
          </li>
        </ul>
      </aside>
      <main class="cuerpo">
        <div class="tarjeta-contenedora">
          <h1 class="titulo-dashboard">
            Resumen de estado de las incidencias del sistema.
          </h1>

          <div class="contenedor-tarjetas">
            <!-- Tarjeta: Total -->
            <div class="tarjeta-resumen tarjeta-total">
              <div class="tarjeta-cabecera">
                <div class="tarjeta-icono">
                  <i class="bi bi-file-earmark-text"></i>
                </div>
                <div class="tarjeta-textos">
                  <span class="tarjeta-titulo">Total</span>
                  <span class="tarjeta-numero" id="count-total">0</span>
                </div>
              </div>
              <div class="tarjeta-pie">
                <span class="bold tendencia-positiva">
                  <i class="bi bi-graph-up-arrow"></i> --%
                </span>
                <span class="muted">vs mes pasado</span>
              </div>
            </div>

            <!-- Tarjeta: Pendientes -->
            <div class="tarjeta-resumen tarjeta-pendientes">
              <div class="tarjeta-cabecera">
                <div class="tarjeta-icono"><i class="bi bi-clock"></i></div>
                <div class="tarjeta-textos">
                  <span class="tarjeta-titulo">Pendientes</span>
                  <span class="tarjeta-numero" id="count-pendientes">0</span>
                </div>
              </div>
              <div class="tarjeta-pie">
                <span class="bold tendencia-positiva">
                  <i class="bi bi-graph-up-arrow"></i> --%
                </span>
                <span class="muted">vs mes pasado</span>
              </div>
            </div>

            <!-- Tarjeta: Asignadas -->
            <div class="tarjeta-resumen tarjeta-asignadas">
              <div class="tarjeta-cabecera">
                <div class="tarjeta-icono"><i class="bi bi-person"></i></div>
                <div class="tarjeta-textos">
                  <span class="tarjeta-titulo">Asignadas</span>
                  <span class="tarjeta-numero" id="count-asignadas">0</span>
                </div>
              </div>
              <div class="tarjeta-pie">
                <span class="bold tendencia-positiva">
                  <i class="bi bi-graph-up-arrow"></i> --%
                </span>
                <span class="muted">vs mes pasado</span>
              </div>
            </div>

            <!-- Tarjeta: Finalizadas -->
            <div class="tarjeta-resumen tarjeta-finalizadas">
              <div class="tarjeta-cabecera">
                <div class="tarjeta-icono">
                  <i class="bi bi-check-circle"></i>
                </div>
                <div class="tarjeta-textos">
                  <span class="tarjeta-titulo">Finalizadas</span>
                  <span class="tarjeta-numero" id="count-finalizadas">0</span>
                </div>
              </div>
              <div class="tarjeta-pie">
                <span class="bold tendencia-positiva">
                  <i class="bi bi-graph-up-arrow"></i> --%
                </span>
                <span class="muted">vs mes pasado</span>
              </div>
            </div>

            <!-- Tarjeta: Canceladas -->
            <div class="tarjeta-resumen tarjeta-canceladas">
              <div class="tarjeta-cabecera">
                <div class="tarjeta-icono"><i class="bi bi-x-circle"></i></div>
                <div class="tarjeta-textos">
                  <span class="tarjeta-titulo">Canceladas</span>
                  <span class="tarjeta-numero" id="count-canceladas">0</span>
                </div>
              </div>
              <div class="tarjeta-pie">
                <span class="bold tendencia-negativa">
                  <i class="bi bi-graph-down-arrow"></i> --%
                </span>
                <span class="muted">vs mes pasado</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="../../main.js"></script>
    <script type="module" src="../../js/director-dashboard.js"></script>
  </body>
</html>
