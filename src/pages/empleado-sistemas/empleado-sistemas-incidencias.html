<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>incidencias</title>
    <link rel="stylesheet" href="../../css/stylesis.css">
    </link>
</head>

<body>
    <header class="top-header">
        <div class="logo-container">
            <img class="logo-muni-header" src="../../../assets/logo-muni.png" alt="Logo">
        </div>
    </header>
    <div class="main-layout">
        <aside class="lat-bar">
            <ul class="nav-list">
                <ul class="menu-item  active">
                    <a href="empleado-sistemas-incidencias.html"> Incidencias asignadas</a>
                </ul>
                <ul class="menu-item">
                    <a href="empleado-sistemas-articulos.html"> Articulos</a>
                </ul>
                <ul class="menu-item">
                    <a href="empleado-sistemas-categorias.html"> Categorias</a>
                </ul>
                <li class="menu-item  logout-item">
                    <a href="../../../index.html"> Cerrar sesión</a>
                </li>
            </ul>
        </aside>
        <main class="cuerpo">
            <h1>Incidencias</h1>
            <div class="tarjeta-contenedora">
                <div class="container-filtro">
                    <div class="filtro-grupo">
                        <label for="filtro-estado">Estado</label>
                        <select id="filtro-estado"> <!--Acá cambiaria al nombre que tenga en la base de datos-->
                            <option value="">Todos los Estados</option>
                            <option value="asignada">Asignada</option>
                            <option value="enproceso">En Proceso</option>
                            <option value="resuelta">Resuelta</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                    </div>
                    <div class="filtro-grupo">
                        <label for="filtro-prioridad">Prioridad</label>
                        <select id="filtro-prioridad">
                            <option value="">Todas las Prioridades</option>
                            <option value="1">Alta</option>
                            <option value="2">Media</option>
                            <option value="3">Baja</option>
                        </select>
                    </div>
                    <div class="filtro-grupo">
                        <label for="filtro-nro-articulo"> Descripción</label>
                        <input type="text" id="filtro-nro-articulo" placeholder="N° Incidencia o Artículo">

                    </div>

                    <button class="btn-buscar">Filtrar</button>
                </div>

                <div class="tabla-resultados">
                    <table class="tabla-incidencias">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Artículo</th>
                                <th scope="col">Descripción</th>
                                <th scope="col">Prioridad</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-incidencias">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../../main.js"></script>
    <script type="module" src="./empleado-sistemas-incidencias.js"></script>

</body>

</html>
