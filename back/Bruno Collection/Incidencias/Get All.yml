info:
  name: Get All
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:3000/api/incidencias?order_column=id_incidencia&&direction=DESC&&limit=10&&offset=0
  params:
    - name: order_column
      value: id_incidencia
      type: query
    - name: direction
      value: DESC
      type: query
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
