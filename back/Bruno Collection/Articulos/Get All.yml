info:
  name: Get All
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/articulos?order_column=id_area&direction=DESC&limit=10&offset=0
  params:
    - name: order_column
      value: id_area
      type: query
    - name: direction
      value: DESC
      type: query
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
    - name: id_area
      value: ""
      type: query
      disabled: true
    - name: id_categoria
      value: ""
      type: query
      disabled: true
    - name: descripcion
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
